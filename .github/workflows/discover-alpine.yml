name: discover-alpine

# Daily: detect a stable Alpine MINOR release newer than the pinned STABLE in
# buildchain/alpine-bases.env (via the CDN's latest-stable pointer).
#
#  - Nothing new: auto-close any stale alpine-bump issues (a prior migration
#    landed). No other output.
#  - New release detected:
#      1. readiness - check the two external prerequisites: the
#         docker.io/library/alpine:<new> builder/smoke image and the
#         Cloudsmith alpine/v<new> publish distribution. A release can be cut
#         upstream days before either exists; building without the image is
#         impossible and merging without the distribution would break publish,
#         so both gate the validate legs.
#      2. validate  - build the modern tier on the new base (allow_fail: a new
#         base is expected to break some lines; that red/green IS the failure
#         frontier). Does NOT publish. Skipped while readiness is false - the
#         daily run retries it for free once upstream catches up.
#      3. propose    - open a DRAFT PR setting STABLE=<new>/PREVIOUS=<old> in
#         alpine-bases.env, and open ONE GitHub issue linking the PR + the
#         validation run. The issue lists what is still being waited on when
#         readiness is false. Notifies in person; the per-line breakage fixes
#         stay a human job.
#
# Why validation runs here (not in the PR branch): a PR opened by GITHUB_TOKEN
# cannot trigger ci.yml (GitHub loop-prevention), so the build is done in this
# workflow and the draft PR is informational. Phase 2, Option A.
#
# The end-to-end "new release" path only fires when a new Alpine actually ships;
# it is not exercised on the daily nothing-new runs.

on:
  schedule:
    - cron: "13 5 * * *"   # daily ~05:13 UTC, off the round hour
  workflow_dispatch:

permissions:
  contents: write        # propose pushes the alpine-bump-<new> branch
  issues: write          # reconcile/propose open + close the issue
  pull-requests: write   # propose opens the draft PR

concurrency:
  group: discover-alpine
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      new: ${{ steps.det.outputs.new }}
      stable: ${{ steps.det.outputs.stable }}
      newest: ${{ steps.det.outputs.newest }}
      docker_ready: ${{ steps.ready.outputs.docker_ready }}
      cloudsmith_ready: ${{ steps.ready.outputs.cloudsmith_ready }}
      waiting: ${{ steps.ready.outputs.waiting }}
    steps:
      - uses: actions/checkout@v7
      - name: Detect new Alpine release
        id: det
        run: ./scripts/discover-alpine.sh
      - name: Check build/publish prerequisites (Docker Hub image, Cloudsmith distribution)
        id: ready
        if: steps.det.outputs.new != ''
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: ./scripts/check-alpine-readiness.sh '${{ steps.det.outputs.new }}'

  reconcile:
    # Nothing new: if STABLE caught up to upstream, close any stale issues.
    needs: discover
    if: needs.discover.result == 'success' && needs.discover.outputs.new == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Close stale alpine-bump issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/notify-alpine-release.sh \
            '' '${{ needs.discover.outputs.stable }}' '${{ needs.discover.outputs.newest }}'

  validate:
    # New release: probe whether the modern tier builds on the new base. Best
    # effort on every leg - breakage here is the signal, not a failure.
    # Gated on readiness: without the Docker Hub image the builder cannot even
    # start, and without the Cloudsmith distribution a merged bump could not
    # publish - the daily schedule retries both for free.
    needs: discover
    if: needs.discover.result == 'success' && needs.discover.outputs.new != ''
        && needs.discover.outputs.docker_ready == 'true'
        && needs.discover.outputs.cloudsmith_ready == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { line: "20",      arch: x86_64,  runner: ubuntu-latest }
          - { line: "20",      arch: aarch64, runner: ubuntu-24.04-arm }
          - { line: "22",      arch: x86_64,  runner: ubuntu-latest }
          - { line: "22",      arch: aarch64, runner: ubuntu-24.04-arm }
          - { line: "22-cert", arch: x86_64,  runner: ubuntu-latest }
          - { line: "22-cert", arch: aarch64, runner: ubuntu-24.04-arm }
          - { line: "23",      arch: x86_64,  runner: ubuntu-latest }
          - { line: "23",      arch: aarch64, runner: ubuntu-24.04-arm }
          - { line: "24",      arch: x86_64,  runner: ubuntu-latest }
          - { line: "24",      arch: aarch64, runner: ubuntu-24.04-arm }
    uses: ./.github/workflows/_build.yml
    with:
      line: ${{ matrix.line }}
      arch: ${{ matrix.arch }}
      runner: ${{ matrix.runner }}
      platform: ''
      allow_fail: true
      alpine_version: ${{ needs.discover.outputs.new }}
    secrets: inherit

  propose:
    # Open the draft PR + the issue regardless of which validation legs passed
    # (breakage is expected; the run link carries the detail).
    needs: [discover, validate]
    if: always() && needs.discover.result == 'success' && needs.discover.outputs.new != ''
    runs-on: ubuntu-latest
    steps:
      # GITHUB_TOKEN cannot open PRs here - see the same step in
      # discover-releases.yml. The App token can, and PRs it opens do trigger
      # ci.yml, so the bump branch gets validated instead of sitting untested.
      - name: Mint the release-bot App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
      - name: Open / refresh draft PR
        id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          ./scripts/open-alpine-bump-pr.sh \
            '${{ needs.discover.outputs.new }}' \
            '${{ needs.discover.outputs.stable }}'
      - name: Open / refresh issue (links PR + validation run)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ./scripts/notify-alpine-release.sh \
            '${{ needs.discover.outputs.new }}' \
            '${{ needs.discover.outputs.stable }}' \
            '${{ needs.discover.outputs.newest }}' \
            '${{ steps.pr.outputs.pr_url }}' \
            "$RUN_URL" \
            '${{ needs.discover.outputs.waiting }}'
